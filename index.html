<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* Estilos básicos para centrar el formulario */
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f4f4f4; 
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
            text-align: center;
            width: 300px; /* Ancho fijo para la caja */
        }
        input[type="text"], input[type="password"], button { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            background-color: #5cb85c; 
            color: white; 
            cursor: pointer; 
            border: none;
            font-size: 16px;
        }
        label {
            display: block; 
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        .enlace-registro { /* Estilo para el enlace de registro */
            text-align: center; 
            margin-top: 15px; 
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Ingresa al Sistema</h2>
        
        <form action="dashboard.html" method="get">
            
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required placeholder="tu.usuario">
            
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" required placeholder="*******">
            
            <button type="submit">
                Ingresar
            </button>
            
        </form>
        
        <div class="enlace-registro">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
