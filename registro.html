<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* CSS para el formulario de registro */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #e3f2fd; margin: 0; }
        .registro-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); width: 350px; }
        h2 { text-align: center; color: #1e88e5; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1e88e5; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #1565c0; }
        .requisitos { font-size: 0.9em; color: #757575; margin-bottom: 20px; text-align: left;}
        .enlace-login { text-align: center; margin-top: 20px; font-size: 0.9em; }

        /* ------------------- ESTILOS DE NOTIFICACIÓN MODAL ------------------- */
        #custom-alert-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            display: none; /* Oculto por defecto */
            text-align: center;
        }
        .custom-alert {
            min-width: 250px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            color: white;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            transform: scale(0.9);
        }
        .custom-alert.show {
            opacity: 1;
            transform: scale(1);
        }
        .custom-alert.success {
            background-color: #4CAF50; /* Verde */
        }
        .custom-alert.error {
            background-color: #f44336; /* Rojo */
        }
        .custom-alert i {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }
        .custom-alert button {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            margin-top: 10px;
            padding: 5px 15px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>
    
    <div id="custom-alert-container"></div>

    <div class="registro-box">
        <h2>Crear Nueva Cuenta</h2>
        
        <form id="registration-form"> 
            
            <label for="email">Correo Electrónico (Gmail):</label>
            <input type="email" id="email" name="email" required placeholder="tu.correo@gmail.com">

            <label for="username">Nombre de Usuario:</label>
            <input type="text" id="username" name="username" required placeholder="Crea tu nombre de usuario">
            
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" required>

            <div class="requisitos">
                * La contraseña debe tener entre **9 y 16 dígitos**. <br>
                * Debe incluir mayúsculas, minúsculas y números.
            </div>
            
            <button type="submit">
                Registrarse y Acceder
            </button>
            
        </form>

        <div class="enlace-login">
            ¿Ya tienes cuenta? <a href="index.html">Inicia Sesión aquí</a>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script> 
    <script type="module" src="registro.js"></script> 

</body>
</html>
