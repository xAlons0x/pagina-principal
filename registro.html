<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <style>
        /* CSS para el formulario de registro */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #e3f2fd; margin: 0; }
        .registro-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); width: 350px; }
        h2 { text-align: center; color: #1e88e5; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1e88e5; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #1565c0; }
        .requisitos { font-size: 0.9em; color: #757575; margin-bottom: 20px; text-align: left;}
        .enlace-login { text-align: center; margin-top: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="registro-box">
        <h2>Crear Nueva Cuenta</h2>
        
        <form id="registration-form"> 
            
            <label for="register-email">Correo Electrónico (Gmail):</label>
            <input type="email" id="register-email" name="email" required placeholder="tu.correo@gmail.com">

            <label for="register-username">Nombre de Usuario:</label>
            <input type="text" id="register-username" name="username" required placeholder="Crea tu nombre de usuario">
            
            <label for="register-password">Contraseña:</label>
            <input type="password" id="register-password" name="password" required>

            <div class="requisitos">
                * La contraseña debe tener entre **9 y 16 dígitos**. <br>
                * Debe incluir mayúsculas, minúsculas y números.
            </div>
            
            <button type="submit">
                Registrarse y Acceder
            </button>
            
        </form>

        <div class="enlace-login">
            ¿Ya tienes cuenta? <a href="index.html">Inicia Sesión aquí</a>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script> 
    <script type="module" src="registro.js"></script> 

</body>
</html>
